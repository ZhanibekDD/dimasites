    <linearGradient id="snow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#b8cbd5"/></linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
