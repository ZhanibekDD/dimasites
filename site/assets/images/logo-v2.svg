<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Знак группы компаний ДНЕПР — снежная вершина</title>
  <defs>
    <linearGradient id="yellow" x1="8" y1="5" x2="53" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE465"/>
      <stop offset="0.46" stop-color="#FFD429"/>
      <stop offset="1" stop-color="#F2BD08"/>
    </linearGradient>
    <linearGradient id="steel" x1="8" y1="51" x2="57" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5E737E"/>
      <stop offset="1" stop-color="#3D4E57"/>
    </linearGradient>
  </defs>
  <!-- Жёлтый исходный квадрат с тем же горным вырезом, что и в старом знаке. -->
  <path fill="url(#yellow)" d="M4 4h56v41H49L32 28 15 45H4V4Z"/>
  <!-- Белым заменена именно прежняя чёрная задняя гора: снег, а не новая плашка. -->
  <path fill="#FFFFFF" d="M4 45h11l17-17 17 17h11v12H47L32 42 17 57H4V45Z"/>
  <!-- Стальная передняя гора сохранена отдельным нижним слоем. -->
  <path fill="url(#steel)" d="M4 54h14l14-14 14 14h14v6H45L32 47 19 60H4v-6Z"/>
  <path fill="none" stroke="#7F939D" stroke-opacity=".62" stroke-width="1" d="m19 56 13-13 13 13"/>
  <path fill="#FFF4B8" fill-opacity=".7" d="M7 7h50v1.25H7z"/>
</svg>
