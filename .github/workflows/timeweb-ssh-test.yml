name: Timeweb HTTPS reachability

on:
  push:
    branches:
      - agent/timeweb-ssh-test
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-https:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Stroydnepr HTTPS
        shell: bash
        run: |
          curl --fail --silent --show-error --head             --connect-timeout 15 --max-time 25             https://stroydnepr.ru/
