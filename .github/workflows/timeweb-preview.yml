name: Timeweb preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeweb-preview
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://preview.stroydnepr.ru/
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate website
        run: python3 scripts/check_site.py
      - name: Deploy preview to Timeweb
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.TIMEWEB_FTP_SERVER }}
          username: ${{ secrets.TIMEWEB_PREVIEW_FTP_USERNAME }}
          password: ${{ secrets.TIMEWEB_PREVIEW_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./site/
          server-dir: ${{ secrets.TIMEWEB_PREVIEW_DIR }}
          log-level: standard
