name: Validate production source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate website
        run: python3 scripts/check_site.py
      - name: Validate PHP gateways
        run: find site -type f -name '*.php' -print0 | xargs -0 -n1 php -l
