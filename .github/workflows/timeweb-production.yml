name: Timeweb production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeweb-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://stroydnepr.ru/
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate website
        run: python3 scripts/check_site.py
      - name: Deploy accepted version to Timeweb
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.TIMEWEB_FTP_SERVER }}
          username: ${{ secrets.TIMEWEB_PRODUCTION_FTP_USERNAME }}
          password: ${{ secrets.TIMEWEB_PRODUCTION_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./site/
          server-dir: ${{ secrets.TIMEWEB_PRODUCTION_DIR }}
          log-level: standard
